name: Build ShareX (PR)

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release
          - Debug
          - Steam
          - MicrosoftStore
          - MicrosoftStoreDebug
        platform:
          - x64
          - ARM64
        exclude:
          # Steam configuration doesn't support ARM64
          - configuration: Steam
            platform: ARM64

    env:
      SOLUTION_FILE_PATH: ShareX.sln
      APP_PROJECT_PATH: ShareX\ShareX.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Set PLATFORM & RUNTIME_ID
        run: |
          $platform = if ("${{ matrix.platform }}" -eq "ARM64") { "arm64" } else { "x64" }
          echo "PLATFORM=$platform" >> $env:GITHUB_ENV
          echo "RUNTIME_ID=win-$platform" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        run: |
          if ("${{ matrix.platform }}" -eq "ARM64") {
            dotnet restore --runtime "${{ env.RUNTIME_ID }}" "${{ env.APP_PROJECT_PATH }}"
          } else {
            dotnet restore --runtime "${{ env.RUNTIME_ID }}" "${{ env.SOLUTION_FILE_PATH }}"
          }

      - name: Build
        run: |
          $project = if ("${{ matrix.platform }}" -eq "ARM64") {
            "${{ env.APP_PROJECT_PATH }}"
          } else {
            "${{ env.SOLUTION_FILE_PATH }}"
          }
          dotnet build --no-restore --configuration "${{ matrix.configuration }}" -p:Platform="${{ matrix.platform }}" --self-contained true /m:1 $project

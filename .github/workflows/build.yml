name: Build ShareX HDR

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-hdr"
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"

permissions:
  contents: read

jobs:
  build:
    name: Build and test x64 release
    runs-on: windows-latest

    env:
      APP_PROJECT_PATH: ShareX\ShareX.csproj
      SETUP_PROJECT_PATH: ShareX.Setup\ShareX.Setup.csproj
      TEST_PROJECT_PATH: ShareX.ScreenCaptureLib.Tests\ShareX.ScreenCaptureLib.Tests.csproj
      ASSEMBLY_INFO_PATH: Directory.build.props
      PLATFORM: x64
      RUNTIME_ID: win-x64

    outputs:
      APP_VERSION: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Set APP_VERSION
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "${{ env.ASSEMBLY_INFO_PATH }}" -Raw
          $pattern = '<Version>([0-9]+(?:\.[0-9]+){1,3})</Version>'
          $match = [regex]::Match($content, $pattern)
          if (!$match.Success) {
            throw "Could not read the application version from ${{ env.ASSEMBLY_INFO_PATH }}."
          }

          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF -eq "refs/heads/develop") {
            $version = "$version.$env:GITHUB_RUN_NUMBER"
            $content = [regex]::Replace($content, $pattern, "<Version>$version</Version>")
            Set-Content -Path "${{ env.ASSEMBLY_INFO_PATH }}" -Value $content -NoNewline
          }

          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "app_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Application version: $version"

      - name: Download API keys
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
        if: env.API_KEYS != ''
        run: Invoke-WebRequest -Uri "$env:API_KEYS" -OutFile "ShareX.UploadersLib\APIKeys\APIKeysLocal.cs"

      - name: Restore application
        run: dotnet restore --runtime "${{ env.RUNTIME_ID }}" "${{ env.APP_PROJECT_PATH }}"

      - name: Restore setup
        run: dotnet restore --runtime "${{ env.RUNTIME_ID }}" "${{ env.SETUP_PROJECT_PATH }}"

      - name: Build application
        run: dotnet build --no-restore --configuration Release -p:Platform="${{ env.PLATFORM }}" --self-contained true /m:1 "${{ env.APP_PROJECT_PATH }}"

      - name: Build setup
        run: dotnet build --no-restore --configuration Release -p:Platform="${{ env.PLATFORM }}" --self-contained true /m:1 "${{ env.SETUP_PROJECT_PATH }}"

      - name: Restore tests
        run: dotnet restore "${{ env.TEST_PROJECT_PATH }}"

      - name: Run tests
        run: dotnet test "${{ env.TEST_PROJECT_PATH }}" --no-restore --configuration Release

      - name: Package setup and portable release
        run: '& "ShareX.Setup\bin\Release\win-x64\ShareX.Setup.exe" -silent -job Release -platform "${{ env.PLATFORM }}"'

      - name: Upload setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: Setup-x64
          path: Output\ShareX-${{ env.APP_VERSION }}-setup-x64.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: Portable-x64
          path: Output\ShareX-${{ env.APP_VERSION }}-portable-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      RELEASE_BODY_PATH: RELEASE_BODY.md
      APP_VERSION: ${{ needs.build.outputs.APP_VERSION }}

    steps:
      - name: Download setup artifact
        uses: actions/download-artifact@v8
        with:
          name: Setup-x64
          path: Output

      - name: Download portable artifact
        uses: actions/download-artifact@v8
        with:
          name: Portable-x64
          path: Output

      - name: Create release body
        shell: pwsh
        run: |
          $checksums = Get-ChildItem -Path "Output\" -File |
            Sort-Object -Property Name |
            ForEach-Object { "| $($_.Name) | ``$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)`` |" } |
            Out-String
          $output = "| File | SHA256 |`r`n| --- | --- |`r`n$($checksums.Trim())"
          $output >> $env:GITHUB_STEP_SUMMARY
          Set-Content -Path "${{ env.RELEASE_BODY_PATH }}" -Value $output -NoNewline

      - name: Publish development prerelease
        if: github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}-hdr
          target_commitish: ${{ github.sha }}
          name: ShareX HDR ${{ env.APP_VERSION }} Dev
          body_path: ${{ env.RELEASE_BODY_PATH }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            Output/ShareX-${{ env.APP_VERSION }}-setup-x64.exe
            Output/ShareX-${{ env.APP_VERSION }}-portable-x64.zip

      - name: Create stable release draft
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ShareX HDR ${{ env.APP_VERSION }}
          body_path: ${{ env.RELEASE_BODY_PATH }}
          generate_release_notes: true
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            Output/ShareX-${{ env.APP_VERSION }}-setup-x64.exe
            Output/ShareX-${{ env.APP_VERSION }}-portable-x64.zip
